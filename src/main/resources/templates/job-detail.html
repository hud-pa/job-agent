<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${job.title} + ' - Job Detail'">Job Detail</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container my-4">
        <!-- Top Navigation & Action Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/jobs}" class="btn btn-outline-secondary">
                &larr; Back to listings
            </a>
            <div>
                <a th:href="${job.url}" target="_blank" class="btn btn-primary me-2">
                    Open Original Listing &#8599;
                </a>
                <button class="btn btn-success me-2" id="markAppliedBtn" th:data-id="${job.id}" onclick="updateJobStatus(this.getAttribute('data-id'), 'applied')">
                    Mark as Applied
                </button>
                <button class="btn btn-danger" id="deleteJobBtn" th:data-id="${job.id}" onclick="deleteJob(this.getAttribute('data-id'))">
                    Delete
                </button>
            </div>
        </div>

        <!-- Job Overview Card -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h2 class="card-title fw-bold" th:text="${job.title}">Job Title</h2>
                        <h5 class="card-subtitle text-muted mb-2">
                            <span th:text="${job.company}">Company</span> &bull; 
                            <span th:text="${job.location}">Location</span>
                        </h5>
                    </div>
                    <span class="badge bg-secondary fs-6" th:text="${job.status}">Status</span>
                </div>
                <div class="row mt-3 text-secondary small">
                    <div class="col-md-3"><strong>Source:</strong> <span th:text="${job.source}">Source</span></div>
                    <div class="col-md-3"><strong>Date Found:</strong> <span th:text="${#temporals.format(job.dateFound, 'dd-MM-yyyy')}">Date</span></div>
                    <div class="col-md-3"><strong>Evaluated:</strong> <span th:text="${job.aiEvaluated ? 'Yes' : 'No'}">No</span></div>
                </div>
            </div>
        </div>

        <!-- AI Evaluation Section -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">AI Evaluation & Match Details</h4>
                <div th:if="${job.recommendation != null}">
                    <span class="badge fs-6"
                          th:classappend="${job.recommendation == 'APPLY' ? 'bg-success' : (job.recommendation == 'CONSIDER' ? 'bg-warning text-dark' : 'bg-danger')}"
                          th:text="${job.recommendation}">
                        RECOMMENDATION
                    </span>
                </div>
            </div>
            <div class="card-body">
                <!-- Overall AI Score -->
                <div class="mb-4">
                    <h6 class="fw-bold">Overall Match Score</h6>
                    <div class="progress" style="height: 25px;">
                        <div class="progress-bar fw-bold fs-6"
                             role="progressbar"
                             th:style="'width: ' + (${job.aiScore != null ? job.aiScore : 0}) + '%'"
                             th:classappend="${job.aiScore != null ? (job.aiScore >= 70 ? 'bg-success' : (job.aiScore >= 40 ? 'bg-warning text-dark' : 'bg-danger')) : 'bg-secondary'}"
                             th:aria-valuenow="${job.aiScore != null ? job.aiScore : 0}"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             th:text="${job.aiScore != null ? job.aiScore + '%' : 'N/A'}">
                        </div>
                    </div>
                </div>

                <!-- Sub-Scores Grid -->
                <h6 class="fw-bold mb-3">Sub-Scores</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label mb-1">Technical Match</label>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-info"
                                 role="progressbar"
                                 th:style="'width: ' + (${job.technicalMatch != null ? job.technicalMatch : 0}) + '%'"
                                 th:text="${job.technicalMatch != null ? job.technicalMatch + '%' : 'N/A'}">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label mb-1">Language Match</label>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-info"
                                 role="progressbar"
                                 th:style="'width: ' + (${job.languageMatch != null ? job.languageMatch : 0}) + '%'"
                                 th:text="${job.languageMatch != null ? job.languageMatch + '%' : 'N/A'}">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label mb-1">Level Match</label>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-info"
                                 role="progressbar"
                                 th:style="'width: ' + (${job.levelMatch != null ? job.levelMatch : 0}) + '%'"
                                 th:text="${job.levelMatch != null ? job.levelMatch + '%' : 'N/A'}">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label mb-1">Location Match</label>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-info"
                                 role="progressbar"
                                 th:style="'width: ' + (${job.locationMatch != null ? job.locationMatch : 0}) + '%'"
                                 th:text="${job.locationMatch != null ? job.locationMatch + '%' : 'N/A'}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Strengths & Missing Skills -->
                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <h6 class="fw-bold text-success">Strengths</h6>
                        <p class="border p-2 rounded bg-light" th:text="${job.strengths != null && !job.strengths.isBlank() ? job.strengths : 'N/A'}">Java, Spring Boot</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h6 class="fw-bold text-danger">Missing Skills</h6>
                        <p class="border p-2 rounded bg-light" th:text="${job.missingSkills != null && !job.missingSkills.isBlank() ? job.missingSkills : 'N/A'}">Docker, Kubernetes</p>
                    </div>
                </div>

                <!-- AI Summary -->
                <div>
                    <h6 class="fw-bold">AI Summary</h6>
                    <p class="border p-3 rounded bg-light" th:text="${job.aiReasoning != null && !job.aiReasoning.isBlank() ? job.aiReasoning : 'No reasoning available.'}">Reasoning text</p>
                </div>
            </div>
        </div>


    </div>

    <script>
        async function updateJobStatus(id, status) {
            try {
                const response = await fetch(`/api/jobs/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update job status.');
                }
            } catch (error) {
                alert('An error occurred while updating status.');
            }
        }

        async function deleteJob(id) {
            if (confirm('Are you sure you want to delete this job listing?')) {
                try {
                    const response = await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        window.location.href = '/jobs';
                    } else {
                        alert('Failed to delete job.');
                    }
                } catch (error) {
                    alert('An error occurred while deleting the job.');
                }
            }
        }
    </script>
</div>
</body>
</html>
