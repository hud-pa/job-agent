<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Job Listings</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Job Listings</h2>
            <div>
                <button id="findJobsBtn" class="btn btn-primary">Find New Jobs</button>
                <div class="form-check form-switch d-inline-block ms-3">
                    <input class="form-check-input" type="checkbox" id="showAllToggle">
                    <label class="form-check-label" for="showAllToggle">Show All</label>
                </div>
            </div>
        </div>

        <div id="loadingSpinner" class="d-none text-center my-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Searching and evaluating jobs...</p>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Location</th>
                    <th style="min-width: 130px;">AI Score</th>
                    <th>Recommendation</th>
                    <th>Match Details</th>
                    <th>Status</th>
                    <th>Date Found</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="jobs-table-body">
                <th:block th:each="job : ${jobs}">
                    <tr th:classappend="${!job.aiEvaluated} ? 'unevaluated' : ''">
                        <td>
                            <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}" class="fw-bold text-decoration-none">Title</a>
                        </td>
                        <td th:text="${job.company}">Company</td>
                        <td th:text="${job.location}">Location</td>
                        <td>
                            <div th:if="${job.aiScore != null}" class="progress" style="height: 20px;">
                                <div class="progress-bar fw-bold"
                                     role="progressbar"
                                     th:style="'width: ' + ${job.aiScore} + '%'"
                                     th:classappend="${job.aiScore >= 70 ? 'bg-success' : (job.aiScore >= 40 ? 'bg-warning text-dark' : 'bg-danger')}"
                                     th:aria-valuenow="${job.aiScore}"
                                     aria-valuemin="0"
                                     aria-valuemax="100"
                                     th:text="${job.aiScore + '%'}">
                                </div>
                            </div>
                            <span th:if="${job.aiScore == null}" class="text-muted">N/A</span>
                        </td>
                        <td>
                            <span th:if="${job.recommendation != null}"
                                  class="badge"
                                  th:classappend="${job.recommendation == 'APPLY' ? 'bg-success' : (job.recommendation == 'CONSIDER' ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${job.recommendation}">
                            </span>
                            <span th:if="${job.recommendation == null}" class="text-muted">N/A</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-info"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    th:attr="data-bs-target='#details-' + ${job.id}"
                                    aria-expanded="false">
                                Details &#9660;
                            </button>
                        </td>
                        <td><span class="badge bg-secondary" th:text="${job.status}">Status</span></td>
                        <td th:text="${#temporals.format(job.dateFound, 'dd-MM-yyyy')}">Date</td>
                        <td>
                            <button th:if="${!job.seen}" class="btn btn-sm btn-outline-secondary me-1 seen-btn"
                                    th:attr="data-job-id=${job.id}">Mark Seen</button>
                            <button class="btn btn-sm btn-outline-success me-1 applied-btn"
                                    th:attr="data-job-id=${job.id}">Applied</button>
                            <button class="btn btn-sm btn-outline-danger delete-btn"
                                    th:attr="data-job-id=${job.id}">Delete</button>
                        </td>
                    </tr>
                    <tr th:id="'details-' + ${job.id}" class="collapse bg-light" th:classappend="${!job.aiEvaluated} ? 'unevaluated' : ''">
                        <td colspan="9" class="p-3">
                            <div class="row g-2 mb-2">
                                <div class="col-md-3">
                                    <strong>Technical Match:</strong> <span th:text="${job.technicalMatch != null ? job.technicalMatch : 'N/A'}"></span>
                                </div>
                                <div class="col-md-3">
                                    <strong>Language Match:</strong> <span th:text="${job.languageMatch != null ? job.languageMatch : 'N/A'}"></span>
                                </div>
                                <div class="col-md-3">
                                    <strong>Level Match:</strong> <span th:text="${job.levelMatch != null ? job.levelMatch : 'N/A'}"></span>
                                </div>
                                <div class="col-md-3">
                                    <strong>Location Match:</strong> <span th:text="${job.locationMatch != null ? job.locationMatch : 'N/A'}"></span>
                                </div>
                            </div>
                            <div class="mt-2">
                                <strong>Strengths:</strong> <span th:text="${job.strengths != null && !job.strengths.isBlank() ? job.strengths : 'N/A'}"></span>
                            </div>
                            <div class="mt-1">
                                <strong>Missing Skills:</strong> <span th:text="${job.missingSkills != null && !job.missingSkills.isBlank() ? job.missingSkills : 'N/A'}"></span>
                            </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Event delegation for action buttons
            const tableBody = document.getElementById('jobs-table-body');
            tableBody.addEventListener('click', function(event) {
                const target = event.target;
                const jobId = target.getAttribute('data-job-id');
                if (!jobId) return;

                if (target.classList.contains('delete-btn')) {
                    deleteJob(jobId);
                } else if (target.classList.contains('seen-btn')) {
                    markAsSeen(jobId);
                } else if (target.classList.contains('applied-btn')) {
                    updateStatus(jobId, 'applied');
                }
            });

            // Find New Jobs button
            document.getElementById('findJobsBtn').addEventListener('click', findNewJobs);

            // Show All toggle
            const showAllToggle = document.getElementById('showAllToggle');
            showAllToggle.addEventListener('change', function() {
                const isChecked = this.checked;
                document.querySelectorAll('.unevaluated').forEach(row => {
                    row.style.display = isChecked ? 'table-row' : 'none';
                });
            });

            // Hide unevaluated rows by default
            document.querySelectorAll('.unevaluated').forEach(row => {
                row.style.display = 'none';
            });
        });

        async function findNewJobs() {
            const spinner = document.getElementById('loadingSpinner');
            const errorMsg = document.getElementById('errorMessage');
            const btn = document.getElementById('findJobsBtn');

            spinner.classList.remove('d-none');
            errorMsg.classList.add('d-none');
            btn.disabled = true;

            try {
                console.log('Starting job scraping...');
                const scrapeResponse = await fetch('/api/jobs/scrape', { method: 'POST' });
                if (!scrapeResponse.ok) {
                    throw new Error(`Scraping failed with status: ${scrapeResponse.statusText}`);
                }
                console.log('Scraping completed.');

                console.log('Starting job evaluation...');
                const evaluateResponse = await fetch('/api/jobs/evaluate', { method: 'POST' });
                if (!evaluateResponse.ok) {
                    throw new Error(`Evaluation failed with status: ${evaluateResponse.statusText}`);
                }
                console.log('Evaluation completed.');

                window.location.reload();
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('d-none');
            } finally {
                spinner.classList.add('d-none');
                btn.disabled = false;
            }
        }

        async function deleteJob(id) {
            if (confirm('Are you sure you want to delete this job?')) {
                try {
                    const response = await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Failed to delete job.');
                    }
                } catch (error) {
                    alert('An error occurred while deleting the job.');
                }
            }
        }

        async function markAsSeen(id) {
            try {
                const response = await fetch(`/api/jobs/${id}/seen`, { method: 'PUT' });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to mark job as seen.');
                }
            } catch (error) {
                alert('An error occurred.');
            }
        }

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`/api/jobs/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update job status.');
                }
            } catch (error) {
                alert('An error occurred.');
            }
        }
    </script>
</div>
</body>
</html>
