spring.application.name=job-agent

spring.datasource.url=jdbc:postgresql://localhost:5432/job_agent
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gemini API Configuration
# It is recommended to set this as an environment variable (GEMINI_API_KEY) for security
gemini.api.key=${GEMINI_API_KEY:your_actual_api_key_here}
